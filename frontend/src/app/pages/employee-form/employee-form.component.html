<div class="page-container">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>
        {{ isEditMode ? "Edit Employee" : "Add Employee" }}
      </mat-card-title>

      <mat-card-subtitle>
        {{
          isEditMode
            ? "Update the employee information"
            : "Enter the employee information"
        }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>

          <input matInput formControlName="name" placeholder="John Doe" />

          <mat-error *ngIf="employeeForm.controls.name.hasError('required')">
            Name is required.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>

          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="john.doe@example.com"
          />

          <mat-error *ngIf="employeeForm.controls.email.hasError('required')">
            Email is required.
          </mat-error>

          <mat-error *ngIf="employeeForm.controls.email.hasError('email')">
            Please enter a valid email address.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Position</mat-label>

          <input
            matInput
            formControlName="position"
            placeholder="Software Engineer"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Salary</mat-label>

          <input
            matInput
            type="number"
            formControlName="salary"
            min="0"
            placeholder="55000"
          />

          <mat-error *ngIf="employeeForm.controls.salary.hasError('min')">
            Salary cannot be negative.
          </mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="form-actions">
          <a mat-button routerLink="/employees"> Cancel </a>

          <button mat-raised-button color="primary" type="submit">
            {{ isEditMode ? "Update Employee" : "Add Employee" }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
