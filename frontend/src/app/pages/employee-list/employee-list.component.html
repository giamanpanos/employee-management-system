<div class="page-container">
  <div class="page-header">
    <div>
      <h1>Employees</h1>
      <p>Manage your employees</p>
    </div>

    <a mat-raised-button color="primary" routerLink="/employees/new">
      <mat-icon>add</mat-icon>
      Add Employee
    </a>
  </div>

  <div class="table-container">
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <table mat-table [dataSource]="employees">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let employee">
          {{ employee.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let employee">
          {{ employee.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let employee">
          {{ employee.email }}
        </td>
      </ng-container>

      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef>Position</th>
        <td mat-cell *matCellDef="let employee">
          {{ employee.position || "-" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="salary">
        <th mat-header-cell *matHeaderCellDef>Salary</th>
        <td mat-cell *matCellDef="let employee">
          {{ employee.salary | number: "1.2-2" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let employee">
          <a mat-button [routerLink]="['/employees', employee.id, 'details']">
            Details
          </a>

          <a
            mat-button
            color="primary"
            [routerLink]="['/employees', employee.id]"
          >
            Edit
          </a>

          <button
            mat-button
            color="warn"
            type="button"
            (click)="deleteEmployee(employee.id!)"
          >
            Delete
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <div class="loading-container" *ngIf="loading">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Loading employees...</p>
    </div>

    <p
      class="empty-message"
      *ngIf="!loading && employees.length === 0 && !errorMessage"
    >
      No employees found.
    </p>
  </div>
</div>
